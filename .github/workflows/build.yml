name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project NexusChat.xcodeproj -scheme NexusChat -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NexusChat.app Payload/
          zip -r NexusChat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NexusChat-ipa
          path: NexusChat.ipa
