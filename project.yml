name: NexusChat
options:
  bundleIdPrefix: com.nexus
  deploymentTarget:
    iOS: "16.0"
targets:
  NexusChat:
    type: application
    platform: iOS
    sources: [NexusChat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.chat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nexus Chat
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
